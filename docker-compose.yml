services:
  oai-source:
    build:
      context: ./sample-oai
    image: union-catalog/sample-oai:latest
    environment:
      # 模拟成员馆换系统期间积压的大批书目：
      # 65,536 条不同标识、每页 256 条（共 256 页）、每条 4 KiB dc:description，
      # datestamp 分布在 2026-10-01 起的 90 天内（约 728 条/天）
      RECORD_COUNT: "65536"
      PAGE_SIZE: "256"
      DESCRIPTION_BYTES: "4096"
      DELETED_INDEX: "0"
      DATE_SPAN_DAYS: "90"
      PORT: "8080"
      TOKEN_TTL: "3600"
      BASE_URL: "http://oai-source:8080/oai"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  harvester-api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: union-catalog/harvester-api:latest
    depends_on:
      oai-source:
        condition: service_healthy
    environment:
      OAI_ENDPOINT: "http://oai-source:8080/oai"
      APP_DB_PATH: "/data/harvester.db"
    # 256 MiB 内存上限：采集端按页流式落盘暂存，整批采完才单事务提交
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "8000:8000"
    volumes:
      - harvester-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  harvester-data:
